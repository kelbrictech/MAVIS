<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Page Flow Generator</title><style>*{margin:0;padding:0;box-sizing:border-box}:root{--primary:#0066cc;--success:#388e3c;--danger:#d32f2f;--border:#ddd;--bg:#f5f5f5;--text:#333;--light-text:#666}body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--text);line-height:1.6}html,body{height:100%;overflow:hidden}.app{display:flex;flex-direction:column;height:100vh}.header{background:#fff;border-bottom:1px solid var(--border);padding:15px;text-align:center}.header h1{font-size:18px}.header p{font-size:12px;color:var(--light-text)}.content{flex:1;display:flex;flex-direction:column;overflow:hidden}.view-tabs{display:flex;background:#f0f0f0;border-bottom:1px solid var(--border)}.view-tab{flex:1;padding:12px;border:0;background:transparent;cursor:pointer;font-size:13px;color:var(--light-text);border-bottom:3px solid transparent}.view-tab.active{color:var(--text);border-bottom-color:var(--primary);background:#fff}.pages-view,.editor-view,.visualizer-view{display:none;flex:1;overflow-y:auto;flex-direction:column}.pages-view.active,.editor-view.active,.visualizer-view.active{display:flex}.pages-list{flex:1;overflow-y:auto;padding:10px}.page-item{padding:12px;background:#fff;border:1px solid var(--border);border-radius:4px;margin-bottom:8px;cursor:pointer;position:relative}.page-item-title{font-size:14px;font-weight:500}.page-item-num{font-size:12px;color:var(--light-text)}.page-item-delete{position:absolute;top:8px;right:8px;background:var(--danger);color:#fff;border:0;width:24px;height:24px;border-radius:3px}.pages-empty,.visualizer-empty{text-align:center;padding:30px;color:var(--light-text);font-size:13px}.editor-form{flex:1;overflow-y:auto;padding:15px}.form-group{margin-bottom:15px}.form-group label{display:block;font-size:12px;font-weight:600;margin-bottom:5px}.form-group input,.form-group textarea,.form-group select{width:100%;padding:10px;border:1px solid var(--border);border-radius:4px;font-size:14px}.form-group textarea{min-height:80px}.form-actions,.visualizer-nav{display:flex;gap:8px;padding:15px;background:#fff;border-top:1px solid var(--border)}button{cursor:pointer}.form-actions button,.toolbar button,.visualizer-nav button{flex:1;padding:10px;background:var(--primary);color:#fff;border:0;border-radius:4px;font-weight:600}.form-actions .cancel,.toolbar .secondary{background:#666}.toolbar{display:flex;flex-direction:column;gap:8px;padding:10px;background:#fff;border-top:1px solid var(--border)}.toolbar-row{display:flex;gap:8px}.visualizer-header{padding:15px;background:#fff;border-bottom:1px solid var(--border);font-size:12px;color:var(--light-text);display:flex;justify-content:space-between}.visualizer-close{background:var(--danger);color:#fff;border:0;width:28px;height:28px}.visualizer{flex:1;overflow-y:auto;padding:15px}.page-preview{background:#fff;border-radius:6px;overflow:hidden}.page-preview-header{padding:12px 15px;background:#f9f9f9;border-bottom:1px solid var(--border)}.page-preview-title{font-weight:600;font-size:13px}.page-preview-zone{font-size:10px;font-weight:600;padding:3px 8px;border-radius:3px}.zone-yellow{background:#fff8e1;color:#f57f17}.zone-red{background:#ffebee;color:#c62828}.zone-blue{background:#e3f2fd;color:#1565c0}.zone-green{background:#e8f5e9;color:#2e7d32}.page-preview-content{padding:15px;position:relative;min-height:200px}.page-preview-content.portrait{aspect-ratio:9/16}.page-preview-content.landscape{aspect-ratio:16/9}.page-watermark{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-size:72px;color:rgba(0,0,0,.08)}.provision-item{padding:6px 0;font-size:12px;position:relative}.page-notes{padding:8px 15px;background:#f9f9f9;font-size:11px;color:var(--light-text)}.message{position:fixed;bottom:20px;left:20px;right:20px;padding:12px;border-radius:4px;color:#fff;z-index:1000}.message.success{background:var(--success)}.message.error{background:var(--danger)}input[type=file]{display:none}</style></head><body><div class="app"><div class="header"><h1>Page Flow Generator</h1><p id="headerSubtitle">Manage your pages</p></div><div class="view-tabs"><button class="view-tab active" onclick="switchView('pages')">Pages</button><button class="view-tab" onclick="switchView('editor')">Editor</button><button class="view-tab" onclick="switchView('visualizer')">Visualizer</button></div><div class="content"><div class="pages-view active" id="pagesView"><div class="pages-list" id="pagesList"></div></div><div class="editor-view" id="editorView"><div class="editor-form"><div class="form-group"><label>Page #</label><input type="number" id="pageNum" min="1"></div><div class="form-group"><label>Page Name</label><input id="pageName"></div><div class="form-group"><label>Zone (Area)</label><select id="pageZone"><option value="YELLOW">YELLOW</option><option value="RED">RED</option><option value="BLUE">BLUE</option><option value="GREEN">GREEN</option><option value="RED + BLUE">RED + BLUE</option></select></div><div class="form-group"><label>Orientation</label><select id="pageOrientation"><option>Portrait</option><option>Landscape</option></select></div><div class="form-group"><label>Provisions (comma-separated)</label><textarea id="pageProvisions"></textarea></div><div class="form-group"><label>Notes (optional)</label><textarea id="pageNotes"></textarea></div></div><div class="form-actions"><button onclick="savePage()">Save</button><button class="cancel" onclick="cancelEdit()">Cancel</button></div></div><div class="visualizer-view" id="visualizerView"><div class="visualizer-header"><span id="vizPageCount">0 pages</span><button class="visualizer-close" onclick="switchView('pages')">✕</button></div><div class="visualizer" id="visualizer"></div><div class="visualizer-nav"><button onclick="vizPrevious()" id="vizPrevBtn">← Prev</button><span><span id="vizCurrent">1</span> / <span id="vizTotal">1</span></span><button onclick="vizNext()" id="vizNextBtn">Next →</button></div></div></div><div class="toolbar"><button onclick="addNewPage()">+ Add Page</button><div class="toolbar-row"><button class="secondary" onclick="downloadTemplate()">⬇️ Download</button><button class="secondary" onclick="document.getElementById('uploadInput').click()">⬆️ Upload</button></div></div></div><input type="file" id="uploadInput" accept=".csv" onchange="handleFileUpload(event)"><script>let pages=[],currentEditIndex=null,visualizerCurrentIndex=0;function init(){let s=localStorage.getItem('pageFlowData');if(s)try{pages=JSON.parse(s)}catch(e){}renderPagesList();renderVisualizer()}function persist(){localStorage.setItem('pageFlowData',JSON.stringify(pages))}function addNewPage(){pages.push({num:pages.length+1,name:`Page ${pages.length+1}`,zone:'YELLOW',orientation:'Portrait',provisions:'',notes:''});currentEditIndex=pages.length-1;persist();switchView('editor');renderEditor()}function editPage(i){currentEditIndex=i;switchView('editor');renderEditor()}function deletePage(i){if(confirm(`Delete "${pages[i].name}"?`)){pages.splice(i,1);pages.forEach((p,j)=>p.num=j+1);persist();renderPagesList();renderVisualizer()}}function savePage(){if(currentEditIndex===null)return;pages[currentEditIndex]={num:+pageNum.value||currentEditIndex+1,name:pageName.value||'Untitled',zone:pageZone.value||'YELLOW',orientation:pageOrientation.value||'Portrait',provisions:pageProvisions.value,notes:pageNotes.value};pages.sort((a,b)=>a.num-b.num);persist();currentEditIndex=null;renderPagesList();renderVisualizer();switchView('pages');showMessage('Page saved!','success')}function cancelEdit(){currentEditIndex=null;switchView('pages')}function renderPagesList(){pagesList.innerHTML=pages.length?'':'<div class="pages-empty">No pages yet.<br>Click "+ Add Page" to start.</div>';pages.forEach((p,i)=>{let d=document.createElement('div');d.className='page-item';d.onclick=()=>editPage(i);d.innerHTML=`<div class="page-item-title">${p.name}</div><div class="page-item-num">Page ${p.num}</div><button class="page-item-delete" onclick="event.stopPropagation();deletePage(${i})">✕</button>`;pagesList.appendChild(d)})}function renderEditor(){if(currentEditIndex===null)return;let p=pages[currentEditIndex];pageNum.value=p.num;pageName.value=p.name;pageZone.value=p.zone;pageOrientation.value=p.orientation||'Portrait';pageProvisions.value=p.provisions;pageNotes.value=p.notes}function renderVisualizer(){vizPageCount.textContent=pages.length+' page'+(pages.length!==1?'s':'');vizTotal.textContent=pages.length;if(!pages.length){visualizer.innerHTML='<div class="visualizer-empty">No pages to preview.<br>Add a page to get started.</div>';return}visualizerCurrentIndex=Math.min(visualizerCurrentIndex,pages.length-1);renderVisualizerPage()}function renderVisualizerPage(){if(!pages.length)return;let p=pages[visualizerCurrentIndex],z=`zone-${p.zone.toLowerCase().split('+')[0].trim()}`,pro=p.provisions.split(',').map(x=>x.trim()).filter(Boolean).map(x=>`<div class="provision-item">• ${x}</div>`).join('');visualizer.innerHTML=`<div class="page-preview"><div class="page-preview-header"><div class="page-preview-title">Page ${p.num}: ${p.name}</div><span class="page-preview-zone ${z}">${p.zone}</span></div><div class="page-preview-content ${(p.orientation||'Portrait').toLowerCase()}"><div class="page-watermark">page ${p.num}</div>${pro}</div>${p.notes?`<div class="page-notes"><strong>Notes:</strong> ${p.notes}</div>`:''}</div>`;vizCurrent.textContent=visualizerCurrentIndex+1;vizPrevBtn.disabled=visualizerCurrentIndex===0;vizNextBtn.disabled=visualizerCurrentIndex===pages.length-1}function vizNext(){if(visualizerCurrentIndex<pages.length-1){visualizerCurrentIndex++;renderVisualizerPage()}}function vizPrevious(){if(visualizerCurrentIndex>0){visualizerCurrentIndex--;renderVisualizerPage()}}function switchView(v){document.querySelectorAll('.pages-view,.editor-view,.visualizer-view').forEach(x=>x.classList.remove('active'));document.querySelectorAll('.view-tab').forEach(x=>x.classList.remove('active'));document.getElementById(v+'View').classList.add('active');document.querySelector(`[onclick="switchView('${v}')"]`).classList.add('active');headerSubtitle.textContent=v==='pages'?'Manage your pages':v==='editor'?'Edit page':'Preview all pages';if(v==='visualizer')renderVisualizer()}function downloadTemplate(){let csv='Page #,Page Name,Zone,Orientation,Provisions,Notes\n'+pages.map(p=>`${p.num},"${p.name}","${p.zone}","${p.orientation}","${p.provisions}","${p.notes}"`).join('\n');let b=new Blob([csv],{type:'text/csv'}),u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download='page-flow.csv';a.click();URL.revokeObjectURL(u)}function handleFileUpload(e){let f=e.target.files[0];if(!f)return;let r=new FileReader;r.onload=x=>{try{let lines=x.target.result.split('\n').filter(Boolean),h=lines[0].split(',').map(x=>x.trim().toLowerCase()),idx=n=>h.indexOf(n);pages=lines.slice(1).map((l,i)=>{let q=l.match(/("[^"]*"|[^,]+)/g)||[];q=q.map(x=>x.trim().replace(/^"|"$/g,''));return{num:+q[idx('page #')]||i+1,name:q[idx('page name')]||`Page ${i+1}`,zone:q[idx('zone')]||'YELLOW',orientation:q[idx('orientation')]||'Portrait',provisions:q[idx('provisions')]||'',notes:q[idx('notes')]||''}});persist();renderPagesList();renderVisualizer();switchView('pages');showMessage(`Loaded ${pages.length} pages!`,'success')}catch(err){showMessage(err.message,'error')}};r.readAsText(f)}function showMessage(t,c){let d=document.createElement('div');d.className=`message ${c}`;d.textContent=t;document.body.appendChild(d);setTimeout(()=>d.remove(),3000)}init();</script></body></html>
